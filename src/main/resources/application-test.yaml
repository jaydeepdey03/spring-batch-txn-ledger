spring:
  application:
    name: txn-ledger
  datasource:
    url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  batch:
    job:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: "classpath:db/batch/schema-h2.sql"
server:
  port: 6969

app:
  scheduler:
    cron: "-"
