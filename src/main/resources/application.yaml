spring:
  application:
    name: txn-ledger
  # datasource:
  #   url: ${DB_URL:jdbc:postgresql://localhost:5432/txn-ledger}
  #   username: ${DB_USERNAME:postgres}
  #   password: ${DB_PASSWORD:test1234}
  #   driver-class-name: org.postgresql.Driver

  datasource:
    url: jdbc:h2:file:./data/batchdb;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  batch:
    job:
      enabled: false
server:
  port: 6969

app:
  h2:
    tcp:
      enabled: true
      port: 9092
      allow-others: true
  batch:
    input-file: "classpath:data/transactions.csv"
  scheduler:
    cron: "0 */15 * * * *"

logging:
  level:
    root: INFO
    com.jaydeep.txn_ledger: DEBUG
    org.springframework.batch: DEBUG
