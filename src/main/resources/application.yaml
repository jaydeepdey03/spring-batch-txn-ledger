spring:
  application:
    name: txn-ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/txn-ledger}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:test1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
server:
  port: 6969

app:
  batch:
    input-file: "./EnrollmentPath.csv"
